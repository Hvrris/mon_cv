<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harris DEGBEGNI — Analytics Engineer</title>
<meta name="description" content="Harris DEGBEGNI — Analytics Engineer, Data & BI Project Lead. Portfolio, expériences, compétences et projets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.19 0.02 260);
    --bg-card: oklch(0.23 0.02 260);
    --border: oklch(0.32 0.02 260);
    --border-hover: oklch(0.4 0.02 260);
    --text: oklch(0.96 0.01 260);
    --text-body: oklch(0.8 0.02 260);
    --text-muted: oklch(0.68 0.02 260);
    --text-dim: oklch(0.72 0.02 260);
    --accent: oklch(0.78 0.13 195);
    --accent-hover: oklch(0.85 0.11 195);
    --accent-on: oklch(0.15 0.02 260);
    --gold: oklch(0.78 0.13 70);
    --danger: oklch(0.7 0.15 30);
  }
  * { box-sizing: border-box; }
  body { margin: 0; scroll-behavior: smooth; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  a { color: var(--accent); }
  a:hover { color: var(--accent-hover); }
  h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }

  .cv-layout { display: grid; grid-template-columns: 340px 1fr; }
  @media (max-width: 900px) {
    .cv-layout { grid-template-columns: 1fr; }
    .cv-sidebar { position: static !important; height: auto !important; border-right: none !important; border-bottom: 1px solid var(--border); }
  }

  .cv-sidebar { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; padding: 40px 28px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 26px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), oklch(0.6 0.1 195)); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--accent-on); font-size: 18px; flex-shrink: 0; }
  .identity { display: flex; align-items: center; gap: 14px; }
  .identity strong { font-family: 'Space Grotesk', sans-serif; font-size: 18px; display: block; }
  .identity span { font-size: 12.5px; color: var(--accent); }
  .pitch { font-size: 14px; line-height: 1.6; color: var(--text-dim); margin: 0; }

  .lang-toggle { display: flex; gap: 4px; border: 1px solid var(--border-hover); border-radius: 20px; padding: 3px; width: fit-content; }
  .lang-btn { padding: 5px 12px; border-radius: 16px; border: 1px solid transparent; font-size: 12px; font-weight: 500; color: var(--text); cursor: pointer; background: transparent; font-family: 'DM Sans', sans-serif; }
  .lang-btn.active { border-color: var(--text); font-weight: 700; background: oklch(0.96 0.01 260 / 0.12); }

  .contact-block { display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; padding: 16px 0; border-top: 1px solid oklch(0.28 0.02 260); border-bottom: 1px solid oklch(0.28 0.02 260); }
  .contact-row { display: flex; justify-content: space-between; gap: 8px; }
  .contact-row span:first-child { color: var(--text-muted); }

  nav.side-nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-link { text-decoration: none; font-size: 14px; padding: 9px 10px; border-radius: 8px; font-weight: 500; color: var(--text-dim); background: transparent; }
  .nav-link.active { font-weight: 700; color: var(--text); background: oklch(0.78 0.13 195 / 0.12); }

  .social-links { display: flex; gap: 10px; margin-top: auto; }
  .social-link { flex: 1; text-align: center; color: oklch(0.85 0.02 260); text-decoration: none; font-size: 13px; border: 1px solid var(--border-hover); border-radius: 8px; padding: 9px; }
  .social-link:hover { border-color: var(--accent); color: var(--text); }

  .cv-main .wrap { max-width: 820px; margin: 0 auto; padding: 0 32px 64px; }
  .hero-wrap { max-width: 820px; margin: 0 auto; padding: 56px 32px 0; }
  .eyebrow { font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; }
  .hero-wrap h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 700; margin: 12px 0 14px; letter-spacing: -0.02em; }
  .hero-wrap h2 { font-size: 18px; font-weight: 500; color: oklch(0.85 0.02 260); margin: 0 0 22px; }
  .cta-btn { display: inline-flex; background: var(--accent); color: var(--accent-on); text-decoration: none; font-weight: 700; font-size: 15px; padding: 13px 26px; border-radius: 8px; }
  .cta-btn:hover { filter: brightness(1.08); color: var(--accent-on); }

  section { padding-top: 64px; }
  .hero-wrap + section { padding-top: 64px; }
  .section-eyebrow { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
  h3.section-title { font-size: clamp(22px, 3vw, 28px); font-weight: 700; margin: 10px 0 20px; letter-spacing: -0.01em; }
  h3.section-title.no-eyebrow { margin: 0 0 28px; }
  .body-text { font-size: 16px; line-height: 1.7; color: oklch(0.8 0.02 260); margin: 0 0 16px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 14px; margin-bottom: 32px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; }
  .stat-card { padding: 18px; }
  .stat-card strong { font-family: 'Space Grotesk', sans-serif; font-size: 26px; color: var(--accent); display: block; }
  .stat-card span { font-size: 12.5px; color: oklch(0.75 0.02 260); line-height: 1.4; }
  .hover-accent:hover { border-color: var(--accent); }
  .hover-accent-lift:hover { border-color: var(--accent); transform: translateY(-2px); }
  .hover-accent-slide:hover { border-color: var(--accent); transform: translateX(4px); }
  .hover-border:hover { border-color: var(--border-hover); }

  .tag-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .tag { border: 1px solid var(--border-hover); border-radius: 20px; padding: 7px 16px; font-size: 13.5px; color: oklch(0.85 0.02 260); }

  .exp-list { display: flex; flex-direction: column; gap: 16px; }
  .exp-card { padding: 26px; cursor: pointer; transition: border-color .15s; }
  .exp-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .exp-head h4 { font-size: 17px; font-weight: 700; margin: 0; }
  .exp-meta { display: flex; align-items: center; gap: 12px; }
  .exp-period { color: var(--accent); font-size: 13px; font-weight: 600; }
  .exp-chevron { font-size: 16px; color: var(--text-muted); width: 16px; text-align: center; }
  .exp-company { color: var(--gold); font-size: 13.5px; font-weight: 600; margin: 0 0 10px; }
  .exp-intro { font-size: 14.5px; line-height: 1.6; color: oklch(0.8 0.02 260); margin: 0; }
  .exp-bullets { margin: 14px 0; padding-left: 20px; color: oklch(0.8 0.02 260); font-size: 14px; line-height: 1.7; }
  .exp-impact { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--text); }

  .training-card { padding: 26px; }
  .training-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .training-head h4 { font-size: 17px; font-weight: 700; margin: 0; }
  .training-card ul { margin: 0; padding-left: 20px; color: oklch(0.8 0.02 260); font-size: 14px; line-height: 1.7; }

  .subsection-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; margin: 14px 0 -2px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
  .edu-card { padding: 22px; }
  .edu-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .edu-head h4 { font-size: 15.5px; font-weight: 700; margin: 0; }
  .edu-period { color: var(--accent); font-size: 12.5px; font-weight: 600; }
  .edu-institution { color: var(--gold); font-size: 13.5px; font-weight: 600; margin: 0; }

  .skills-groups { display: flex; flex-direction: column; gap: 28px; margin-bottom: 40px; }
  .skills-cat-title { font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 14px; }
  .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; }
  .skill-item { padding: 16px; display: flex; align-items: center; gap: 10px; transition: border-color .15s, transform .15s; }
  .skill-badge { width: 32px; height: 32px; border-radius: 9px; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .skill-badge img { width: 20px; height: 20px; object-fit: contain; }
  .skill-badge .initial { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: var(--accent); }
  .skill-name { font-size: 14px; font-weight: 600; color: var(--text); }

  .subheading { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; margin: 0 0 20px; }
  .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap: 18px; }
  .service-card { padding: 24px; transition: border-color .15s; }
  .service-num { font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; font-weight: 700; color: var(--accent); }
  .service-card h4 { font-size: 16px; font-weight: 700; margin: 8px 0 10px; }
  .service-card p { font-size: 14px; line-height: 1.6; color: oklch(0.78 0.02 260); margin: 0; }

  .projects-list { display: flex; flex-direction: column; gap: 14px; }
  .project-card { padding: 24px; display: flex; gap: 20px; align-items: flex-start; transition: border-color .15s, transform .15s; }
  .project-index { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: var(--border); flex-shrink: 0; }
  .project-tag { font-size: 12px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.05em; }
  .project-card h4 { font-size: 17px; font-weight: 700; margin: 6px 0 6px; }
  .project-card p { font-size: 14px; line-height: 1.6; color: oklch(0.78 0.02 260); margin: 0; }

  .certs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 18px; }
  .cert-card { padding: 22px; transition: border-color .15s; }
  .cert-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .cert-head h4 { font-size: 15px; font-weight: 700; margin: 0; }
  .cert-year { background: var(--accent); color: var(--accent-on); font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 10px; flex-shrink: 0; }
  .cert-issuer { color: var(--gold); font-size: 12.5px; font-weight: 600; margin: 0 0 8px; }
  .cert-card p.cert-desc { font-size: 13.5px; line-height: 1.6; color: oklch(0.78 0.02 260); margin: 0; }

  .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 32px; }
  .contact-col { display: flex; flex-direction: column; gap: 22px; }
  .contact-col strong { font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; display: block; margin-bottom: 8px; }
  .contact-col p { font-size: 14px; color: oklch(0.8 0.02 260); line-height: 1.6; margin: 0; }
  .lang-list { display: flex; flex-direction: column; gap: 6px; }
  .lang-row { display: flex; justify-content: space-between; font-size: 13.5px; color: oklch(0.82 0.02 260); }
  .lang-row span:last-child { color: var(--text-muted); }
  .interest-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .interest-tag { border: 1px solid var(--border-hover); border-radius: 20px; padding: 5px 12px; font-size: 12.5px; color: oklch(0.82 0.02 260); }

  form.contact-form { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 26px; display: flex; flex-direction: column; gap: 14px; }
  form.contact-form input, form.contact-form textarea { background: var(--bg); border: 1px solid var(--border-hover); border-radius: 8px; padding: 12px 14px; color: var(--text); font-size: 14px; font-family: 'DM Sans', sans-serif; }
  form.contact-form textarea { resize: vertical; }
  .submit-btn { background: var(--accent); color: var(--accent-on); border: none; border-radius: 8px; padding: 12px; font-weight: 700; font-size: 14.5px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .submit-btn:hover { filter: brightness(1.08); }
  .form-msg { margin: 0; font-size: 13px; }
  .form-msg.success { color: var(--accent); }
  .form-msg.error { color: var(--danger); }

  footer { border-top: 1px solid var(--border); padding: 24px 32px; max-width: 820px; margin: 0 auto; }
  footer p { margin: 0; font-size: 12.5px; color: var(--text-muted); }
</style>
</head>
<body>
<div id="app"></div>

<script>
const EMPTY_DATA = { experiences: [], training: { title: {}, bullets: { fr: [], en: [] } }, education: [], skillsStack: { languages: [], tools: [], methodologies: [] }, spokenLanguages: [], interests: { fr: [], en: [] }, services: [], projects: [], certifications: [], labels: { fr: { nav: {}, stats: [], domainsList: [] }, en: { nav: {}, stats: [], domainsList: [] } } };
const SECTION_IDS = ["about", "experience", "skills", "projects", "certifications", "contact"];

class App {
  constructor() {
    this.state = { lang: "fr", openExp: {}, active: "about", name: "", email: "", message: "", status: null, data: null };
    this.root = document.getElementById("app");
  }

  init() {
    fetch("./portfolio-data.json")
      .then((r) => r.json())
      .then((data) => { this.state.data = data; this.render(); })
      .catch(() => { this.state.data = EMPTY_DATA; this.render(); });
  }

  t(obj) { return (obj || {})[this.state.lang]; }

  setLang(lang) { this.state.lang = lang; this.render(); }
  toggleExp(id) { this.state.openExp[id] = !this.state.openExp[id]; this.render(); }

  submit(e) {
    e.preventDefault();
    const { name, email, message } = this.state;
    if (!name.trim() || !email.trim() || !message.trim()) { this.state.status = "error"; this.render(); return; }
    this.state.status = "success";
    this.state.name = ""; this.state.email = ""; this.state.message = "";
    this.render();
  }

  mountObserver() {
    if (this._observer) this._observer.disconnect();
    this._observer = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) {
          this.state.active = en.target.id;
          document.querySelectorAll(".nav-link").forEach((el) => {
            el.classList.toggle("active", el.dataset.id === en.target.id);
          });
        }
      });
    }, { rootMargin: "-35% 0px -55% 0px", threshold: 0 });
    SECTION_IDS.forEach((id) => { const el = document.getElementById(id); if (el) this._observer.observe(el); });
  }

  skillBadge(sk) {
    if (sk.logo && sk.logo !== "database") {
      const url = "https://cdn.simpleicons.org/" + sk.logo + "/e6a04d";
      return `<div class="skill-badge"><img src="${url}" alt="${sk.name}"/></div>`;
    }
    if (sk.logo === "database") {
      return `<div class="skill-badge"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="oklch(0.78 0.13 195)" stroke-width="1.8"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"></path><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"></path></svg></div>`;
    }
    return `<div class="skill-badge"><span class="initial">${(sk.name || "?").charAt(0)}</span></div>`;
  }

  render() {
    const data = this.state.data || EMPTY_DATA;
    const lang = this.state.lang;
    const isFr = lang === "fr";
    const L = data.labels[lang];
    const t = (o) => this.t(o);
    const active = this.state.active;

    const navDefs = [
      { id: "about", label: L.nav.about },
      { id: "experience", label: L.nav.experience },
      { id: "skills", label: L.nav.skills },
      { id: "projects", label: L.nav.projects },
      { id: "certifications", label: L.nav.certifications },
      { id: "contact", label: L.nav.contact }
    ];

    const skillsCatDefs = [
      { key: "languages", label: L.skillsLanguages },
      { key: "bi", label: L.skillsBi },
      { key: "bigdata", label: L.skillsBigdata },
      { key: "cloud", label: L.skillsCloud },
      { key: "methodologies", label: L.skillsMethods }
    ];

    const sidebar = `
      <aside class="cv-sidebar">
        <div class="identity">
          <div class="avatar">HD</div>
          <div>
            <strong>Harris DEGBEGNI</strong>
            <span>Analytics Engineer</span>
          </div>
        </div>

        <p class="pitch">${L.heroPitch}</p>

        <div class="lang-toggle">
          <button type="button" class="lang-btn ${isFr ? "active" : ""}" data-lang="fr">FR</button>
          <button type="button" class="lang-btn ${!isFr ? "active" : ""}" data-lang="en">EN</button>
        </div>

        <div class="contact-block">
          <div class="contact-row"><span>${L.locationLabel}</span><span>Paris, France</span></div>
          <div class="contact-row"><span>${L.phoneLabel}</span><a href="tel:+33754246482">+33 7 54 24 64 82</a></div>
          <div class="contact-row"><span>Email</span><a href="mailto:harrisoswalds@hotmail.com">harrisoswalds@hotmail.com</a></div>
        </div>

        <nav class="side-nav">
          ${navDefs.map((n) => `<a class="nav-link ${active === n.id ? "active" : ""}" data-id="${n.id}" href="#${n.id}">${n.label}</a>`).join("")}
        </nav>

        <div class="social-links">
          <a class="social-link" href="https://www.linkedin.com/in/harris-degbegni/" target="_blank" rel="noopener">LinkedIn</a>
          <a class="social-link" href="https://github.com/Hvrris" target="_blank" rel="noopener">GitHub</a>
        </div>
      </aside>`;

    const hero = `
      <div class="hero-wrap">
        <span class="eyebrow">Portfolio</span>
        <h1>${L.heroGreeting}</h1>
        <h2>${L.heroRole}</h2>
        <a class="cta-btn" href="#contact">${L.heroCta}</a>
      </div>`;

    const about = `
      <section id="about">
        <div class="wrap" style="padding-top:0">
          <span class="section-eyebrow">${L.aboutTitle}</span>
          <h3 class="section-title">${L.aboutSubtitle}</h3>
          <p class="body-text">${L.aboutP1}</p>
          <p class="body-text" style="margin-bottom:32px">${L.aboutP2}</p>

          <div class="stats-grid">
            ${L.stats.map((s) => `<div class="card stat-card hover-accent"><strong>${s.n}</strong><span>${s.t}</span></div>`).join("")}
          </div>

          <div class="tag-list">
            ${L.domainsList.map((d) => `<span class="tag">${d}</span>`).join("")}
          </div>
        </div>
      </section>`;

    const experiences = data.experiences.map((e) => {
      const open = !!this.state.openExp[e.id];
      const bullets = (e.bullets || {})[lang] || [];
      return `
        <div class="card exp-card hover-border" data-exp="${e.id}">
          <div class="exp-head">
            <h4>${t(e.title)}</h4>
            <div class="exp-meta">
              <span class="exp-period">${t(e.period)}</span>
              <span class="exp-chevron">${open ? "−" : "+"}</span>
            </div>
          </div>
          <p class="exp-company">${e.company}</p>
          <p class="exp-intro">${t(e.intro)}</p>
          ${open ? `
            <ul class="exp-bullets">${bullets.map((b) => `<li>${b}</li>`).join("")}</ul>
            <p class="exp-impact">${t(e.impact)}</p>
          ` : ""}
        </div>`;
    }).join("");

    const trainingBullets = (data.training.bullets || {})[lang] || [];

    const experienceSection = `
      <section id="experience">
        <div class="wrap">
          <h3 class="section-title no-eyebrow">${L.experienceTitle}</h3>
          <div class="exp-list">
            ${experiences}
            <div class="card training-card">
              <div class="training-head">
                <h4>${t(data.training.title)}</h4>
                <span class="exp-period">${data.training.period}</span>
              </div>
              <ul>${trainingBullets.map((b) => `<li>${b}</li>`).join("")}</ul>
            </div>
            <h4 class="subsection-title">${L.educationTitle}</h4>
            ${data.education.map((ed) => `
              <div class="card edu-card">
                <div class="edu-head">
                  <h4>${ed.degree}</h4>
                  <span class="edu-period">${t(ed.period)}</span>
                </div>
                <p class="edu-institution">${ed.institution}</p>
              </div>`).join("")}
          </div>
        </div>
      </section>`;

    const skillsSection = `
      <section id="skills">
        <div class="wrap">
          <h3 class="section-title no-eyebrow">${L.skillsStackTitle}</h3>
          <div class="skills-groups">
            ${skillsCatDefs.map((c) => `
              <div>
                <h4 class="skills-cat-title">${c.label}</h4>
                <div class="skills-grid">
                  ${(data.skillsStack[c.key] || []).map((sk) => `
                    <div class="card skill-item hover-accent-lift">
                      ${this.skillBadge(sk)}
                      <span class="skill-name">${sk.name}</span>
                    </div>`).join("")}
                </div>
              </div>`).join("")}
          </div>

          <h4 class="subheading">${L.servicesTitle}</h4>
          <div class="services-grid">
            ${data.services.map((s) => `
              <div class="card service-card hover-accent">
                <span class="service-num">${s.num}</span>
                <h4>${t(s.title)}</h4>
                <p>${t(s.text)}</p>
              </div>`).join("")}
          </div>
        </div>
      </section>`;

    const projectsSection = `
      <section id="projects">
        <div class="wrap">
          <h3 class="section-title no-eyebrow">${L.projectsTitle}</h3>
          <div class="projects-list">
            ${data.projects.map((p, i) => `
              <div class="card project-card hover-accent-slide">
                <span class="project-index">0${i + 1}</span>
                <div>
                  <span class="project-tag">${p.tag}</span>
                  <h4>${t(p.title)}</h4>
                  <p>${t(p.detail)}</p>
                </div>
              </div>`).join("")}
          </div>
        </div>
      </section>`;

    const certsSection = `
      <section id="certifications">
        <div class="wrap">
          <h3 class="section-title no-eyebrow">${L.certificationsTitle}</h3>
          <div class="certs-grid">
            ${data.certifications.map((c) => `
              <div class="card cert-card hover-accent">
                <div class="cert-head">
                  <h4>${t(c.title)}</h4>
                  ${c.year ? `<span class="cert-year">${c.year}</span>` : ""}
                </div>
                <p class="cert-issuer">${c.issuer}</p>
                <p class="cert-desc">${t(c.description)}</p>
              </div>`).join("")}
          </div>
        </div>
      </section>`;

    const interests = data.interests[lang] || [];

    const contactSection = `
      <section id="contact">
        <div class="wrap">
          <h3 class="section-title no-eyebrow">${L.contactTitle}</h3>
          <div class="contact-grid">
            <div class="contact-col">
              <div>
                <strong>${L.contactOppTitle}</strong>
                <p>${L.contactOppText}</p>
              </div>
              <div>
                <strong>${L.contactLanguagesTitle}</strong>
                <div class="lang-list">
                  ${data.spokenLanguages.map((lg) => `<div class="lang-row"><span>${lg.name}</span><span>${lg.level}</span></div>`).join("")}
                </div>
              </div>
              <div>
                <strong>${L.contactInterestsTitle}</strong>
                <div class="interest-list">
                  ${interests.map((it) => `<span class="interest-tag">${it}</span>`).join("")}
                </div>
              </div>
            </div>

            <form class="contact-form" id="contact-form">
              <input type="text" name="name" placeholder="${L.formName}" value="${this.state.name}"/>
              <input type="email" name="email" placeholder="${L.formEmail}" value="${this.state.email}"/>
              <textarea name="message" placeholder="${L.formMessage}" rows="4">${this.state.message}</textarea>
              <button type="submit" class="submit-btn">${L.formSend}</button>
              ${this.state.status === "success" ? `<p class="form-msg success">${L.formSuccess}</p>` : ""}
              ${this.state.status === "error" ? `<p class="form-msg error">${L.formError}</p>` : ""}
            </form>
          </div>
        </div>
      </section>`;

    const footer = `<footer><p>${L.footer}</p></footer>`;

    this.root.innerHTML = `
      <div class="cv-layout">
        ${sidebar}
        <div class="cv-main">
          ${hero}
          ${about}
          ${experienceSection}
          ${skillsSection}
          ${projectsSection}
          ${certsSection}
          ${contactSection}
          ${footer}
        </div>
      </div>`;

    this.bindEvents();
    this.mountObserver();
  }

  bindEvents() {
    this.root.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.addEventListener("click", () => this.setLang(btn.dataset.lang));
    });
    this.root.querySelectorAll(".exp-card").forEach((card) => {
      card.addEventListener("click", () => this.toggleExp(card.dataset.exp));
    });
    const form = this.root.querySelector("#contact-form");
    if (form) {
      form.querySelector('[name="name"]').addEventListener("input", (e) => { this.state.name = e.target.value; });
      form.querySelector('[name="email"]').addEventListener("input", (e) => { this.state.email = e.target.value; });
      form.querySelector('[name="message"]').addEventListener("input", (e) => { this.state.message = e.target.value; });
      form.addEventListener("submit", (e) => this.submit(e));
    }
  }
}

const app = new App();
app.init();
</script>
</body>
</html>
